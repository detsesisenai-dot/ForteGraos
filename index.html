<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Frota Mestre - Gestão Logística</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM (UMD Build for browser) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX transpiling in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; -webkit-font-smoothing: antialiased; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    /* Evita text resize indesejado no iOS */
    input, select, textarea { font-size: 16px !important; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // --- MOCK DATA PARA INITIAL STATE ---
    const MOCK_VEHICLES = [
      { id: 'v1', placa: 'RTA-9J82', modelo: 'Scania R540', capacidade: 38, tipo: 'Próprio' },
      { id: 'v2', placa: 'QWW-2A11', modelo: 'Volvo FH540', capacidade: 50, tipo: 'Locado' }
    ];

    const MOCK_DRIVERS = [
      { id: 'd1', nome: 'Carlos Silva', cnh: '123456789' },
      { id: 'd2', nome: 'Ana Souza', cnh: '987654321' }
    ];

    const dOntem = new Date(); dOntem.setDate(dOntem.getDate() - 1);
    const dTresDias = new Date(); dTresDias.setDate(dTresDias.getDate() - 3);

    const MOCK_TRIPS = [
      { 
        id: 't1', numero: '8204', veiculoId: 'v1', veiculoPlaca: 'RTA-9J82', tipoFrota: 'Próprio', motorista: 'Carlos Silva', 
        origem: 'Rio Verde, GO', destino: 'Santos, SP', idaEVolta: true,
        dataSaida: dTresDias.toISOString().split('T')[0], dataRetorno: new Date().toISOString().split('T')[0],
        kmInicial: 120000, kmFinal: 122300, cargaSaida: 38, cargaChegada: 38, horasEspera: 4, litros: 1050,
        receitas: { freteIdaPrev: 13000, freteIda: 13500, freteVoltaPrev: 4000, freteVolta: 4200 },
        despesas: { combustivelPrev: 5000, combustivel: 5250, qtdDiarias: 3, valorDiaria: 150, diaria: 450, alimentacao: 300, hotel: 200 },
        linkAnexo: '', timestamp: Date.now() - 100000
      },
      { 
        id: 't2', numero: '8205', veiculoId: 'v2', veiculoPlaca: 'QWW-2A11', tipoFrota: 'Locado', motorista: 'Ana Souza', 
        origem: 'Sorriso, MT', destino: 'Rondonópolis, MT', idaEVolta: false,
        dataSaida: dOntem.toISOString().split('T')[0], dataRetorno: new Date().toISOString().split('T')[0],
        kmInicial: 55000, kmFinal: 55520, cargaSaida: 50, cargaChegada: 49.2, horasEspera: 8, litros: 220,
        receitas: { freteIdaPrev: 6500, freteIda: 6200, freteVoltaPrev: 0, freteVolta: 0 },
        despesas: { combustivelPrev: 1200, combustivel: 1100, qtdDiarias: 1, valorDiaria: 100, diaria: 100, alimentacao: 120, hotel: 0 },
        linkAnexo: '', timestamp: Date.now() - 50000
      }
    ];

      const MOCK_EXPENSES = [
      { id: 'e1', descricao: '4 Pneus Michelin', categoria: 'Pneus e Borracharia', valorPrevisto: 12000, valor: 12000, data: dTresDias.toISOString().split('T')[0], status: 'Pago', linkAnexo: '', timestamp: Date.now() - 200000 }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [notification, setNotification] = useState({ show: false, message: '', type: 'info' });
      const [deleteTarget, setDeleteTarget] = useState(null); 
      const [editId, setEditId] = useState({ type: null, id: null });
      const [tutorialModo, setTutorialModo] = useState(false);

      // --- LOCAL STORAGE (SUBSTITUI O BANCO EM NUVEM PARA GITHUB PAGES) ---
      const [trips, setTrips] = useState(() => { const saved = localStorage.getItem('fm_trips'); return saved ? JSON.parse(saved) : MOCK_TRIPS; });
      const [vehicles, setVehicles] = useState(() => { const saved = localStorage.getItem('fm_vehicles'); return saved ? JSON.parse(saved) : MOCK_VEHICLES; });
      const [drivers, setDrivers] = useState(() => { const saved = localStorage.getItem('fm_drivers'); return saved ? JSON.parse(saved) : MOCK_DRIVERS; });
      const [expenses, setExpenses] = useState(() => { const saved = localStorage.getItem('fm_expenses'); return saved ? JSON.parse(saved) : MOCK_EXPENSES; });

      useEffect(() => { localStorage.setItem('fm_trips', JSON.stringify(trips)); }, [trips]);
      useEffect(() => { localStorage.setItem('fm_vehicles', JSON.stringify(vehicles)); }, [vehicles]);
      useEffect(() => { localStorage.setItem('fm_drivers', JSON.stringify(drivers)); }, [drivers]);
      useEffect(() => { localStorage.setItem('fm_expenses', JSON.stringify(expenses)); }, [expenses]);

      const showNotification = (msg, type = 'info') => {
        setNotification({ show: true, message: msg, type });
        setTimeout(() => setNotification({ show: false, message: '', type: 'info' }), 3500);
      };

      // Recarregar ícones do Lucide sempre que a aba mudar
      useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

      // --- STATES FORMULÁRIOS ---
      const [novoCaminhao, setNovoCaminhao] = useState({ placa: '', modelo: '', capacidade: '', tipo: 'Próprio' });
      const [novoMotorista, setNovoMotorista] = useState({ nome: '', cnh: '' });
      const [novaDespesa, setNovaDespesa] = useState({ descricao: '', categoria: 'Pneus e Borracharia', valor: '', valorPrevisto: '', data: new Date().toISOString().split('T')[0], status: 'Pendente', veiculoId: '', linkAnexo: '' });

      const [form, setForm] = useState({
        veiculoId: '', motorista: '', dataSaida: new Date().toISOString().split('T')[0], dataRetorno: '', 
        origem: '', destino: '', idaEVolta: false, kmInicial: '', kmFinal: '', 
        cargaSaida: '', cargaChegada: '', horasEspera: '',
        freteIdaPrev: '', freteVoltaPrev: '', freteIda: '', freteVolta: '', 
        combustivel: '', combustivelPrev: '', litros: '', 
        qtdDiarias: '', valorDiaria: '', alimentacao: '', hotel: '', linkAnexo: ''
      });

      const [distanciaEst, setDistanciaEst] = useState(0);

      const formatCurrency = (val) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val || 0);
      const parseBRNumber = (val) => {
        if (typeof val === 'number') return val;
        if (typeof val !== 'string' || !val) return 0;
        const p = parseFloat(val.replace(/\./g, '').replace(',', '.'));
        return isNaN(p) ? 0 : p;
      };

      // --- SIMULADOR DE DISTÂNCIA ---
      useEffect(() => {
        if (form.origem.length > 2 && form.destino.length > 2) {
          const str = form.origem.toLowerCase().trim() + form.destino.toLowerCase().trim();
          let hash = 0; for (let i = 0; i < str.length; i++) { hash = ((hash << 5) - hash) + str.charCodeAt(i); hash |= 0; }
          let dist = 150 + (Math.abs(hash) % 2000);
          if (form.idaEVolta) dist *= 2;
          setDistanciaEst(dist);
          if (editId.type !== 'trip') setForm(prev => ({ ...prev, kmFinal: String((parseBRNumber(prev.kmInicial) || 0) + dist) }));
        } else setDistanciaEst(0);
      }, [form.origem, form.destino, form.idaEVolta]);

      const handleKmInicialChange = (e) => {
        const val = e.target.value;
        setForm(prev => ({ ...prev, kmInicial: val, kmFinal: distanciaEst > 0 && editId.type !== 'trip' ? String((parseBRNumber(val) || 0) + distanciaEst) : prev.kmFinal }));
      };

      // --- DRE & INDICADORES ---
      const ind = useMemo(() => {
        let tRecP = 0, tRec = 0, tDesp = 0, tKm = 0, tCar = 0, tCarD = 0, tKmV = 0, tLit = 0, tHor = 0, tDespP = 0;
        trips.forEach(t => {
          tRecP += (t.receitas?.freteIdaPrev || 0) + (t.receitas?.freteVoltaPrev || 0);
          const r = (t.receitas?.freteIda || 0) + (t.receitas?.freteVolta || 0); tRec += r;
          tDesp += (t.despesas?.combustivel || 0) + (t.despesas?.diaria || 0) + (t.despesas?.alimentacao || 0) + (t.despesas?.hotel || 0);
          tDespP += (t.despesas?.combustivelPrev || t.despesas?.combustivel || 0) + (t.despesas?.diaria || 0) + (t.despesas?.alimentacao || 0) + (t.despesas?.hotel || 0);
          const kmT = (t.kmFinal || 0) - (t.kmInicial || 0); tKm += kmT;
          tCar += (t.cargaSaida || 0); tCarD += (t.cargaChegada || t.cargaSaida || 0); tLit += (t.litros || 0); tHor += (t.horasEspera || 0);
          if (t.idaEVolta && (!t.receitas?.freteVolta || t.receitas?.freteVolta === 0)) tKmV += (kmT / 2);
        });
        
        let tDespExt = 0; let tDespExtP = 0;
        expenses.forEach(e => { tDespExt += (e.valor || 0); tDespExtP += (e.valorPrevisto || e.valor || 0); });

        const luc = tRec - (tDesp + tDespExt); const q = tCar - tCarD;
        const totalDespReal = tDesp + tDespExt;
        const mediaDespDiaria = tKm > 0 ? (totalDespReal / 30) : 0; 
        const sustentabilidadeDias = mediaDespDiaria > 0 && luc > 0 ? (luc / mediaDespDiaria) : 0;

        return {
          tRecP, tRec, tDesp, tDespP, tDespExt, tDespExtP, luc, tKm, tCar, q,
          pQ: tCar > 0 ? (q / tCar) * 100 : 0, tC: trips.length,
          mKmV: trips.length > 0 ? (tKm / trips.length) : 0, pKmV: tKm > 0 ? (tKmV / tKm) * 100 : 0,
          mKmL: tLit > 0 ? (tKm / tLit) : 0, mH: trips.length > 0 ? (tHor / trips.length) : 0,
          cT: tCarD > 0 ? ((tDesp + tDespExt) / tCarD) : 0, rV: trips.length > 0 ? (luc / trips.length) : 0, mM: tRec > 0 ? (luc / tRec) * 100 : 0,
          totalDespReal, mediaDespDiaria, sustentabilidadeDias
        };
      }, [trips, expenses]);

      // --- HANDLERS E CRUD LOCAL ---
      const handleAddCaminhao = () => {
        if (!novoCaminhao.placa || !novoCaminhao.modelo) return showNotification("Preencha placa e modelo.", "error");
        const d = { ...novoCaminhao, capacidade: parseFloat(novoCaminhao.capacidade) || 0, timestamp: Date.now() };
        if(editId.type === 'vehicle') setVehicles(p => p.map(x=>x.id===editId.id?{...x,...d}:x));
        else setVehicles(p => [{...d, id: 'v_'+Date.now()}, ...p]);
        showNotification(editId.type ? "Atualizado!" : "Cadastrado!", "success");
        setNovoCaminhao({ placa: '', modelo: '', capacidade: '', tipo: 'Próprio' }); setEditId({type:null, id:null});
      };

      const handleAddMotorista = () => {
        if (!novoMotorista.nome) return showNotification("Preencha o nome.", "error");
        const d = { ...novoMotorista, timestamp: Date.now() };
        if(editId.type === 'driver') setDrivers(p => p.map(x=>x.id===editId.id?{...x,...d}:x));
        else setDrivers(p => [{...d, id: 'd_'+Date.now()}, ...p]);
        showNotification("Sucesso!", "success");
        setNovoMotorista({ nome: '', cnh: '' }); setEditId({type:null, id:null});
      };

      const handleSalvarViagem = () => {
        if (!form.veiculoId || !form.origem || !form.destino || !form.kmFinal || !form.motorista || !form.dataSaida) {
            return showNotification("Atenção: Preencha todos os campos obrigatórios básicos (Datas, Veículo, Rota e KMs).", "error");
        }
        
        const v = vehicles.find(x => String(x.id) === String(form.veiculoId)) || { id: 'ext', placa: 'Avulso', tipo: 'Terceirizado', capacidade: 38 };
        
        const docData = {
          veiculoId: v.id, veiculoPlaca: v.placa, tipoFrota: v.tipo, motorista: form.motorista, 
          dataSaida: form.dataSaida, dataRetorno: form.dataRetorno,
          origem: form.origem, destino: form.destino, idaEVolta: form.idaEVolta, linkAnexo: form.linkAnexo,
          kmInicial: parseBRNumber(form.kmInicial), kmFinal: parseBRNumber(form.kmFinal), 
          cargaSaida: parseBRNumber(form.cargaSaida), cargaChegada: parseBRNumber(form.cargaChegada),
          horasEspera: parseBRNumber(form.horasEspera), litros: parseBRNumber(form.litros),
          receitas: { freteIdaPrev: parseBRNumber(form.freteIdaPrev), freteIda: parseBRNumber(form.freteIda), freteVoltaPrev: parseBRNumber(form.freteVoltaPrev), freteVolta: parseBRNumber(form.freteVolta) },
          despesas: { combustivelPrev: parseBRNumber(form.combustivelPrev), combustivel: parseBRNumber(form.combustivel), qtdDiarias: parseBRNumber(form.qtdDiarias), valorDiaria: parseBRNumber(form.valorDiaria), diaria: parseBRNumber(form.qtdDiarias)*parseBRNumber(form.valorDiaria), alimentacao: parseBRNumber(form.alimentacao), hotel: parseBRNumber(form.hotel) }
        };

        if (editId.type === 'trip') { 
          setTrips(p => p.map(x => x.id === editId.id ? {...x, ...docData} : x));
          showNotification("Viagem atualizada com sucesso!", "success"); 
        } else { 
          docData.numero = Math.floor(1000 + Math.random() * 9000).toString(); 
          docData.timestamp = Date.now(); 
          setTrips(p => [{...docData, id: 't_'+Date.now()}, ...p]);
          showNotification("Viagem salva e processada!", "success"); 
        }
        resetForm(); setActiveTab('fluxo');
      };

      const handleAddDespesa = () => {
        if (!novaDespesa.descricao || !novaDespesa.valor) return showNotification("Preencha descrição e valor.", "error");
        const d = { ...novaDespesa, valor: parseBRNumber(novaDespesa.valor), valorPrevisto: parseBRNumber(novaDespesa.valorPrevisto), timestamp: Date.now() };
        if(editId.type === 'expense') setExpenses(p => p.map(x=>x.id===editId.id?{...x,...d}:x));
        else setExpenses(p => [{...d, id: 'e_'+Date.now()}, ...p]);
        showNotification("Despesa salva!", "success");
        setNovaDespesa({ descricao: '', categoria: 'Pneus e Borracharia', valor: '', valorPrevisto: '', data: new Date().toISOString().split('T')[0], status: 'Pendente', veiculoId: '', linkAnexo: '' }); setEditId({type:null, id:null});
      };

      const executeDelete = () => {
        if(!deleteTarget) return;
        if(deleteTarget.type === 'trip') setTrips(p => p.filter(x => x.id !== deleteTarget.id));
        if(deleteTarget.type === 'vehicle') setVehicles(p => p.filter(x => x.id !== deleteTarget.id));
        if(deleteTarget.type === 'driver') setDrivers(p => p.filter(x => x.id !== deleteTarget.id));
        if(deleteTarget.type === 'expense') setExpenses(p => p.filter(x => x.id !== deleteTarget.id));
        showNotification("Apagado.", "success"); setDeleteTarget(null);
      };

      const loadTrip = (t) => {
        setForm({
          veiculoId: t.veiculoId, motorista: t.motorista, dataSaida: t.dataSaida || '', dataRetorno: t.dataRetorno || '', origem: t.origem, destino: t.destino, idaEVolta: t.idaEVolta,
          kmInicial: String(t.kmInicial||''), kmFinal: String(t.kmFinal||''), cargaSaida: String(t.cargaSaida||''), cargaChegada: String(t.cargaChegada||''), horasEspera: String(t.horasEspera||''), linkAnexo: t.linkAnexo||'',
          freteIdaPrev: String(t.receitas?.freteIdaPrev||''), freteVoltaPrev: String(t.receitas?.freteVoltaPrev||''), freteIda: String(t.receitas?.freteIda||''), freteVolta: String(t.receitas?.freteVolta||''),
          combustivelPrev: String(t.despesas?.combustivelPrev||''), combustivel: String(t.despesas?.combustivel||''), litros: String(t.litros||''), qtdDiarias: String(t.despesas?.qtdDiarias||''), valorDiaria: String(t.despesas?.valorDiaria||''), alimentacao: String(t.despesas?.alimentacao||''), hotel: String(t.despesas?.hotel||'')
        });
        setEditId({ type: 'trip', id: t.id }); setActiveTab('new'); window.scrollTo(0,0); showNotification("Modo de Edição Ativado.", "info");
      };

      const loadExpense = (e) => {
        setNovaDespesa({ descricao: e.descricao, categoria: e.categoria, valor: String(e.valor||''), valorPrevisto: String(e.valorPrevisto||''), data: e.data, status: e.status, veiculoId: e.veiculoId||'', linkAnexo: e.linkAnexo||'' });
        setEditId({ type: 'expense', id: e.id }); window.scrollTo(0,0); showNotification("Editando despesa.", "info");
      };
      
      const resetForm = () => {
        setForm({ veiculoId: '', motorista: '', dataSaida: new Date().toISOString().split('T')[0], dataRetorno: '', origem: '', destino: '', idaEVolta: false, kmInicial: '', kmFinal: '', cargaSaida: '', cargaChegada: '', horasEspera: '', freteIdaPrev: '', freteVoltaPrev: '', freteIda: '', freteVolta: '', combustivel: '', combustivelPrev: '', litros: '', qtdDiarias: '', valorDiaria: '', alimentacao: '', hotel: '', linkAnexo: '' });
        setEditId({ type: null, id: null });
      };

      const exportData = () => {
        const data = JSON.stringify({ trips, vehicles, drivers, expenses });
        const blob = new Blob([data], {type: "application/json"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = `frota-mestre-backup-${new Date().toISOString().split('T')[0]}.json`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        showNotification("Backup baixado. Você pode guardar este arquivo no Google Drive.", "success");
      };

      // --- TELAS ---
      const renderDashboard = () => {
        const hj = new Date();
        const ds = Array.from({length: 14}, (_, i) => { const d = new Date(); d.setDate(hj.getDate() - 5 + i); return d; });
        
        return (
          <div className="space-y-6 pb-20 md:pb-6 animate-in fade-in">
            {/* GANTT E BACKUP */}
            <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 relative overflow-hidden">
              <div className="flex justify-between items-center mb-6">
                <h2 className="text-sm font-bold flex items-center"><i data-lucide="activity" className="mr-2 w-5 h-5 text-blue-500"></i> Controle de Operações (Gantt)</h2>
                <button onClick={exportData} className="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-3 py-1.5 rounded-lg flex items-center transition-colors">
                   <i data-lucide="download" className="w-3 h-3 mr-1"></i> Fazer Backup (Drive)
                </button>
              </div>
              
              <div className="min-w-full overflow-x-auto relative custom-scrollbar pb-4">
                <div className="flex border-b border-slate-200 pl-32 pb-2 relative z-20">
                  {ds.map((d, i) => (
                    <div key={i} className={`flex-1 text-center text-[10px] font-bold ${d.toDateString()===hj.toDateString()?'text-rose-600 bg-rose-50 rounded py-0.5':'text-slate-400'}`}>
                      {d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}
                    </div>
                  ))}
                </div>
                
                <div className="absolute top-6 bottom-0 w-px border-l-2 border-dashed border-rose-400 z-10" style={{ left: `calc(8rem + ((100% - 8rem)/14)*5.5)` }}></div>

                <div className="pt-4 space-y-4 relative z-20">
                  {trips.length === 0 ? <div className="text-xs text-slate-400 text-center py-4">Nenhuma viagem em andamento.</div> : trips.map(t => {
                    const sDate = t.dataSaida ? new Date(t.dataSaida) : new Date();
                    const rDate = t.dataRetorno ? new Date(t.dataRetorno) : new Date(sDate.getTime() + (Math.max(1, ((t.kmFinal||0)-(t.kmInicial||0))/600) * 86400000)); 
                    const durDias = Math.max(1, Math.ceil((rDate - sDate) / (1000 * 60 * 60 * 24)));
                    let off = 5; if(sDate < hj) off = 5 - Math.ceil((hj - sDate) / (1000 * 60 * 60 * 24)); if(sDate > hj) off = 5 + Math.ceil((sDate - hj) / (1000 * 60 * 60 * 24));
                    off = Math.max(0, Math.min(13, off)); 

                    return (
                      <div key={t.id} className="flex items-center text-xs group cursor-pointer hover:bg-slate-50 transition-colors rounded-lg p-1" onClick={() => loadTrip(t)} title="Clique para Editar">
                        <div className="w-32 truncate pr-4 text-slate-700 font-semibold flex items-center group-hover:text-blue-600"><i data-lucide="truck" className="w-3 h-3 mr-1 text-slate-400 group-hover:text-blue-500"></i> {t.veiculoPlaca}</div>
                        <div className="flex-1 relative h-8 bg-slate-50 rounded-lg overflow-hidden border border-slate-100">
                          <div className={`absolute top-0 bottom-0 rounded-lg flex items-center px-3 text-[10px] text-white font-bold truncate transition-all shadow-sm ${t.tipoFrota==='Próprio'?'bg-blue-500 hover:bg-blue-600': t.dataRetorno ? 'bg-emerald-500 hover:bg-emerald-600' : 'bg-amber-500 hover:bg-amber-600'}`} style={{ left: `${(off/14)*100}%`, width: `${Math.min(100, (durDias/14)*100)}%` }}>
                            {t.origem.split(',')[0]} → {t.destino.split(',')[0]}
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>

            {/* CONSOLIDADO DE VIAGENS (NOVO BLOCO) */}
            <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 relative">
              <h2 className="text-sm font-bold flex items-center mb-4"><i data-lucide="list" className="mr-2 w-5 h-5 text-blue-500"></i> Consolidado de Viagens</h2>
              
              <div className="max-h-64 overflow-y-auto custom-scrollbar pr-2 space-y-2">
                {trips.length === 0 ? <p className="text-xs text-slate-400 text-center">Nenhuma viagem encontrada.</p> : trips.map(t => (
                  <div key={t.id} className="flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-200 hover:border-blue-300 transition-colors">
                    <div className="flex flex-col cursor-pointer flex-1" onClick={() => loadTrip(t)}>
                      <span className="text-sm font-bold text-slate-800 hover:text-blue-600 transition-colors">{t.origem} → {t.destino}</span>
                      <span className="text-xs text-slate-500 mt-1">{t.veiculoPlaca} • {t.motorista} • {t.dataSaida}</span>
                    </div>
                    <div className="flex items-center space-x-2 pl-4 border-l border-slate-200 ml-4">

                <div className="relative md:col-span-1 col-span-2"><input type="number" placeholder="Km Final" value={form.kmFinal} onChange={e => setForm({...form, kmFinal: e.target.value})} className="w-full bg-blue-50 border border-blue-200 rounded-xl px-4 py-3 text-sm font-bold text-blue-800 outline-none" /><span className="text-[9px] text-blue-500 ml-1">Odômetro chegada</span></div>
                <div className="relative"><input type="number" placeholder="Peso Saída" value={form.cargaSaida} onChange={e => setForm({...form, cargaSaida: e.target.value})} className="w-full bg-emerald-50 border border-emerald-100 rounded-xl px-4 py-3 text-sm font-semibold text-emerald-800 outline-none" /><span className="text-[9px] text-emerald-600 ml-1">Fazenda</span></div>
                <div className="relative"><input type="number" placeholder="Peso Cheg." value={form.cargaChegada} onChange={e => setForm({...form, cargaChegada: e.target.value})} className="w-full bg-rose-50 border border-rose-100 rounded-xl px-4 py-3 text-sm font-semibold text-rose-800 outline-none" /><span className="text-[9px] text-rose-500 ml-1">Balança</span></div>
                <div className="relative"><input type="number" placeholder="Horas" value={form.horasEspera} onChange={e => setForm({...form, horasEspera: e.target.value})} className="w-full bg-amber-50 border border-amber-100 rounded-xl px-4 py-3 text-sm font-semibold text-amber-800 outline-none" /><span className="text-[9px] text-amber-600 ml-1">Espera</span></div>
              </div>
            </div>

            <div className="pt-6 border-t border-slate-100">
              <h3 className="text-sm font-bold text-emerald-600 mb-4">3. Faturamento de Frete</h3>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div className="space-y-3 bg-slate-50 p-5 rounded-2xl border border-slate-200">
                  <span className="text-xs font-bold text-slate-500 uppercase block mb-1">Valor Orçado</span>
                  <div className="flex space-x-2">
                     <div className="relative flex-1"><input type="number" placeholder="Ida" value={form.freteIdaPrev} onChange={e => setForm({...form, freteIdaPrev: e.target.value})} className="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none" /></div>
                     <div className="relative flex-1"><input type="number" placeholder="Volta" value={form.freteVoltaPrev} onChange={e => setForm({...form, freteVoltaPrev: e.target.value})} className="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none" /></div>
                  </div>
                </div>
                <div className="space-y-3 bg-emerald-50/50 p-5 rounded-2xl border border-emerald-100">
                  <span className="text-xs font-bold text-emerald-700 uppercase block mb-1">Valor Realizado (NF Efetiva)</span>
                  <div className="flex space-x-2">
                     <div className="relative flex-1"><input type="number" placeholder="Ida Real" value={form.freteIda} onChange={e => setForm({...form, freteIda: e.target.value})} className="w-full bg-white border border-emerald-200 rounded-xl px-4 py-3 text-sm font-bold text-emerald-900 outline-none shadow-sm" /></div>
                     <div className="relative flex-1"><input type="number" placeholder="Volta Real" value={form.freteVolta} onChange={e => setForm({...form, freteVolta: e.target.value})} className="w-full bg-white border border-emerald-200 rounded-xl px-4 py-3 text-sm font-bold text-emerald-900 outline-none shadow-sm" /></div>
                  </div>
                </div>
              </div>
            </div>

            <div className="pt-6 border-t border-slate-100">
              <h3 className="text-sm font-bold text-rose-600 mb-4">4. Custos e Despesas</h3>
              <div className="grid grid-cols-2 md:grid-cols-6 gap-4 mb-4">
                <div className="relative col-span-2"><input type="number" placeholder="R$ Previsto Comb." value={form.combustivelPrev} onChange={e => setForm({...form, combustivelPrev: e.target.value})} className="w-full bg-slate-50 border border-rose-100 rounded-xl px-4 py-3 text-sm outline-none" /><span className="text-[9px] text-slate-400 ml-1">Meta Combustível</span></div>
                <div className="relative col-span-2"><input type="number" placeholder="R$ Gasto Real Comb." value={form.combustivel} onChange={e => setForm({...form, combustivel: e.target.value})} className="w-full bg-rose-50 border border-rose-200 rounded-xl px-4 py-3 text-sm font-bold text-rose-800 outline-none" /><span className="text-[9px] text-rose-500 ml-1">Gasto na bomba</span></div>
                <div className="relative col-span-2"><input type="number" placeholder="Litros Abastecidos" value={form.litros} onChange={e => setForm({...form, litros: e.target.value})} className="w-full bg-slate-50 border border-rose-100 rounded-xl px-4 py-3 text-sm outline-none" /><span className="text-[9px] text-slate-400 ml-1">Volume total</span></div>
              </div>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div className="relative"><input type="number" placeholder="Qtd Diárias" value={form.qtdDiarias} onChange={e => setForm({...form, qtdDiarias: e.target.value})} className="w-full bg-slate-50 border border-rose-100 rounded-xl px-4 py-3 text-sm outline-none" /></div>
                <div className="relative"><input type="number" placeholder="R$ por Diária" value={form.valorDiaria} onChange={e => setForm({...form, valorDiaria: e.target.value})} className="w-full bg-slate-50 border border-rose-100 rounded-xl px-4 py-3 text-sm outline-none" /></div>
                <div className="relative"><input type="number" placeholder="R$ Alimentação" value={form.alimentacao} onChange={e => setForm({...form, alimentacao: e.target.value})} className="w-full bg-slate-50 border border-rose-100 rounded-xl px-4 py-3 text-sm outline-none" /></div>
                <div className="relative"><input type="number" placeholder="R$ Hotel" value={form.hotel} onChange={e => setForm({...form, hotel: e.target.value})} className="w-full bg-slate-50 border border-rose-100 rounded-xl px-4 py-3 text-sm outline-none" /></div>
              </div>
              
              <div className="mt-4 border-2 border-dashed border-slate-200 rounded-xl p-4 text-center">
                <span className="text-xs font-bold text-slate-600 block">Link Anexo de Documentos</span>
                <input type="text" placeholder="Cole o link do Drive/Dropbox com CTE aqui..." value={form.linkAnexo} onChange={e => setForm({...form, linkAnexo: e.target.value})} className="mt-2 w-full text-xs bg-white border border-slate-200 p-2 rounded-lg text-center outline-none"/>
              </div>
            </div>

            <button onClick={handleSalvarViagem} className="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-bold py-5 rounded-2xl transition-all shadow-md mt-4 text-lg">
              {editId.type === 'trip' ? 'Atualizar Viagem' : 'Registrar Nova Viagem'}
            </button>
          </div>
        </div>
      )};

      return (
        <React.Fragment>
          {notification.show && (<div className={`fixed top-4 right-4 z-[9999] px-6 py-4 rounded-xl shadow-2xl text-white font-medium flex items-center animate-in slide-in-from-top-4 ${notification.type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'}`}>{notification.message}</div>)}
          
          {deleteTarget && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[9999] flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-8 w-full max-w-sm">
                 <h3 className="text-xl font-bold mb-3">Confirmar</h3>
                 <div className="flex space-x-3"><button onClick={() => setDeleteTarget(null)} className="flex-1 bg-slate-100 font-bold py-3 rounded-xl">Cancelar</button><button onClick={executeDelete} className="flex-1 bg-rose-600 text-white font-bold py-3 rounded-xl">Apagar</button></div>
              </div>
            </div>
          )}

          <div className="min-h-screen bg-slate-50 md:flex font-sans text-slate-900">
            <aside className="hidden md:flex flex-col w-72 bg-white border-r border-slate-200 fixed h-full z-10 shadow-[4px_0_24px_rgba(0,0,0,0.02)]">
              <div className="p-8 flex items-center justify-center border-b border-slate-100 mb-4 bg-slate-50/50">
                <img src="https://i.postimg.cc/nLkYqh6N/Chat-GPT-Image-2-de-set-de-2026-10-57-35.png" alt="Logo" className="h-24 object-contain drop-shadow-md hover:scale-105 transition-transform" />
              </div>
              <nav className="flex-1 px-4 space-y-3 overflow-y-auto">
                <button onClick={()=>setActiveTab('home')} className={`w-full flex items-center space-x-4 px-5 py-4 rounded-2xl ${activeTab==='home'?'bg-blue-50 text-blue-700 font-bold':'text-slate-500 hover:bg-slate-50'}`}><i data-lucide="home"></i><span>Dashboard</span></button>
                <button onClick={()=>setActiveTab('fluxo')} className={`w-full flex items-center space-x-4 px-5 py-4 rounded-2xl ${activeTab==='fluxo'?'bg-blue-50 text-blue-700 font-bold':'text-slate-500 hover:bg-slate-50'}`}><i data-lucide="bar-chart-3"></i><span>Fluxo de Caixa</span></button>
                <button onClick={()=>setActiveTab('new')} className={`w-full flex items-center space-x-4 px-5 py-4 rounded-2xl ${activeTab==='new'?'bg-blue-600 text-white font-bold shadow-lg':'text-slate-500 hover:bg-slate-50'}`}><i data-lucide="plus"></i><span>Lançar Viagem</span></button>
                <button onClick={()=>setActiveTab('cadastros')} className={`w-full flex items-center space-x-4 px-5 py-4 rounded-2xl ${activeTab==='cadastros'?'bg-blue-50 text-blue-700 font-bold':'text-slate-500 hover:bg-slate-50'}`}><i data-lucide="database"></i><span>Cadastros Base</span></button>
              </nav>
            </aside>

            <main className="flex-1 md:ml-72 p-4 md:p-8 max-w-7xl mx-auto w-full pt-6 relative">
              <div className="md:hidden flex flex-col items-center mb-8 w-full"><img src="https://i.postimg.cc/nLkYqh6N/Chat-GPT-Image-2-de-set-de-2026-10-57-35.png" alt="Logo" className="h-20 object-contain drop-shadow-md" /></div>
              {activeTab === 'home' && renderDashboard()}
              {activeTab === 'fluxo' && renderFluxoCaixa()}
              {activeTab === 'new' && renderNewTrip()}
              {activeTab === 'cadastros' && renderCadastros()}
            </main>
            
            <nav className="md:hidden fixed bottom-0 w-full bg-white/90 backdrop-blur-md border-t border-slate-200 shadow-lg z-50 flex justify-around items-center px-1 h-20">
              <button onClick={()=>setActiveTab('home')} className={`flex flex-col items-center justify-center w-full h-full ${activeTab==='home'?'text-blue-600':'text-slate-400'}`}><i data-lucide="home"></i></button>
              <button onClick={()=>setActiveTab('fluxo')} className={`flex flex-col items-center justify-center w-full h-full ${activeTab==='fluxo'?'text-blue-600':'text-slate-400'}`}><i data-lucide="bar-chart-3"></i></button>
              <button onClick={()=>{setActiveTab('new'); resetForm();}} className="relative -top-6 bg-blue-600 text-white shadow-xl shadow-blue-600/30 p-4 rounded-full"><i data-lucide="plus"></i></button>
              <button onClick={()=>setActiveTab('cadastros')} className={`flex flex-col items-center justify-center w-full h-full ${activeTab==='cadastros'?'text-blue-600':'text-slate-400'}`}><i data-lucide="database"></i></button>
            </nav>
          </div>
        </React.Fragment>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
